name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Build + toate testele (GoogleTest + comparatia cu oracolul) pe 3 sisteme
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
          - name: macOS (Clang)
            os: macos-latest
          - name: Windows (MSVC)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DITCH_NATIVE=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Aceleasi teste, cu AddressSanitizer + UndefinedBehaviorSanitizer
  sanitizers:
    name: Linux (GCC, ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Kernel-urile noi folosesc mai multi biti de ASLR decat suporta ASan
      - name: Reduce ASLR entropy for ASan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DITCH_NATIVE=OFF -DITCH_SANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure